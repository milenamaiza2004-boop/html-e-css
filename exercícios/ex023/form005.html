<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="isxmas" value="m">
        <label for="isxmas">Masculino</label><br>
        <input type="radio" name="sexo" id="isxfem" value="f">
        <label for="isxfem">Feminino</label>

    </fieldset>


    <fieldset>
        <legend>Esportes Favoritos</legend>
        <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label>
        <input type="checkbox" name="esnat" id="iesnat"><label for="iesnat"> Natação</label>
        <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label>
        <input type="checkbox" name="esvolei" id="iesvolei"> <label for="iesvolei">Vôlei</label>

    </fieldset>


<p>
    <input type="submit" value="enviar">
    <input type="reset" value="limpar">
</p>

    </form>
</body>
</html>
