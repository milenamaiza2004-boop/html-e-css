<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="icor">Cor:</label>
            <input type="color" name="cor" id="icor" value="#ff0000">
        </p>

        <p>
            <label for="inivel">Nível de Satisfação:</label>
            <input type="range" name="nivel" id="nivel" min="0" max="10" value="0">
        </p>

        <p>
            <label for="ifoto">Foto de Perfil:</label>
            <input type="file" nome="foto" id="ifoto"
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">

        </p>

    </form>
</body>
</html>
