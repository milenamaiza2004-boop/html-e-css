<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width:400px;
        }

        th, td{
            border:1px solid black;
            padding: 10px;
        }
    </style>

</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Área</th>
                <th>Disciplinas</th>
                <th colspan="2">Notas</th>
                <th>Média</th>
            </tr>

            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>8,5</td>
                <td>7,0</td>
                <td>7,5</td>
                
            </tr>

            <tr>
                <td>Física</td>
                <td>9,0</td>
                <td>8,0</td>
                <td>8,5</td>
            </tr>

            <tr>
                <td>Química</td>
                <td>7,5</td>
                <td>6,0</td>
                <td>6,5</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>8,0</td>
                <td>8,0</td>
                <td>8,0</td>
            </tr>

            <tr>
                <th colspan="4" style="text-align: left;">Média de Exatas</th>
                <td>7,6</td>
            </tr>

            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>7,0</td>
                <td>8,0</td>
                <td>7,5</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>8,0</td>
                <td>7,0</td>
                <td>7,5</td>
            </tr>
        </thead>

        <tfoot>
            <th colspan="4" style="text-align: left;">Média de Humanas</th>
            <td>7,5</td>
        </tfoot>
    </table>
</body>
</html>
